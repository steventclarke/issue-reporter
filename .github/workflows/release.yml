name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (major.minor.patch)
        required: true
        type: string
      dry_run:
        description: Run publish with --dry-run
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-2
      RELEASE_ROLE_ARN: ${{ vars.RELEASE_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve release version
        id: release
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$RELEASE_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify coupled versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm run version:check -- "$RELEASE_VERSION"

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish packages
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          DOMAIN=$(aws ssm get-parameter \
            --name /platform/artifacts/codeartifact/domain \
            --region "$AWS_REGION" --query Parameter.Value --output text)
          OWNER=$(aws ssm get-parameter \
            --name /platform/artifacts/codeartifact/domain-owner \
            --region "$AWS_REGION" --query Parameter.Value --output text)
          REGION=$(aws ssm get-parameter \
            --name /platform/artifacts/codeartifact/region \
            --region "$AWS_REGION" --query Parameter.Value --output text)
          REPOSITORY=$(aws ssm get-parameter \
            --name /platform/artifacts/codeartifact/repository \
            --region "$AWS_REGION" --query Parameter.Value --output text)
          SCOPE=$(aws ssm get-parameter \
            --name /platform/artifacts/codeartifact/npm-scope \
            --region "$AWS_REGION" --query Parameter.Value --output text)

          ENDPOINT="${DOMAIN}-${OWNER}.d.codeartifact.${REGION}.amazonaws.com/npm/${REPOSITORY}/"
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$DOMAIN" \
            --domain-owner "$OWNER" \
            --region "$REGION" \
            --query authorizationToken --output text)

          npm config set "//${ENDPOINT}:_authToken" "$TOKEN"
          npm config set "${SCOPE}:registry" "https://${ENDPOINT}"
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --workspaces --dry-run --registry "https://${ENDPOINT}"
          else
            npm publish --workspaces --registry "https://${ENDPOINT}"
          fi
